[package]
name = "my-pegboard"
version = "0.7.1-beta"
description = "페그보드처럼 위젯을 배치하는 개인용 데스크톱 대시보드"
authors = ["Hyunwoo Kim"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "my_pegboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: 앨범 위젯이 로컬 사진을 `asset:`으로 스트리밍한다.
# 이 feature가 없으면 `asset_protocol_scope()`가 컴파일되지 않고, CSP만 보고
# 켜져 있다고 착각하면 `convertFileSrc()`가 **에러 없이 깨진 이미지**를 만든다.
# tauri-plugin-fs는 필요 없다 — 코어 기능이다 (DECISIONS 24.2).
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
# 사진 폴더/파일 선택. **JS 쪽 npm 패키지는 쓰지 않는다** — Rust 커맨드가
# 다이얼로그·스코프 허용·스캔을 한 번에 한다 (commands/album.rs 주석).
tauri-plugin-dialog = "2.7.1"

# HTTP — rustls로 OpenSSL 빌드 의존을 피한다
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "gzip",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# process: `gh auth token`을 서브프로세스로 부른다 (commands/github.rs).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }

# 비밀 저장 — 평문 폴백 없음 (DECISIONS 9장)
keyring = { version = "3", features = ["apple-native"] }

# 로그 — 토큰 마스킹 필수
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }

# Rust struct → TypeScript 타입/커맨드 자동 생성 (DECISIONS 7장)
specta = { version = "2.0.0-rc.22", features = ["derive", "chrono", "serde_json"] }
specta-typescript = "0.0.9"
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[features]
default = []
# 키체인 테스트는 실제 로그인 키체인에 쓴다. 기본 비활성.
keychain-tests = []
